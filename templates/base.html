<!doctype html><html lang="en"><head><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111827"><title>Calling Veera</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head><body><header><div class="brand">Calling Veera</div>{% if role %}<div class="top"><span>{{ user_name }}</span><a href="{{ url_for('logout') }}">Logout</a></div>{% endif %}</header><main>{% with messages=get_flashed_messages(with_categories=true) %}{% if messages %}<div class="alerts">{% for cat,msg in messages %}<div class="alert {{cat}}">{{msg}}</div>{% endfor %}</div>{% endif %}{% endwith %}{% block content %}{% endblock %}</main></body></html>
