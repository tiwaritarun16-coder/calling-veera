{% extends 'base.html' %}{% block content %}<section class="card narrow"><h1>Calling Veera</h1><div class="tabs"><a class="tab active" href="#admin">Admin</a><a class="tab" href="#caller">Caller</a></div><form method="post"><input type="hidden" name="role" id="role" value="admin"><label>Username<input name="username" autocomplete="username" required></label><label>Password<input name="password" type="password" autocomplete="current-password" required></label><button>Login</button></form><p class="muted">Use Admin or Caller login according to your account.</p></section><script>document.querySelectorAll('.tab').forEach(t=>t.onclick=e=>{e.preventDefault();document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));t.classList.add('active');document.getElementById('role').value=t.textContent.toLowerCase()});</script>{% endblock %}
